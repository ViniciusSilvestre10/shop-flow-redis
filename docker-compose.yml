services:
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopflow-net

  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shopflow-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: shopflow-redis-insight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
    networks:
      - shopflow-net

networks:
  shopflow-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  redis_insight_data: