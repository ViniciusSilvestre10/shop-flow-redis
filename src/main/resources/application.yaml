spring:
  application:
    name: ShopFlow

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/shopflow_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: shopflow:session

  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,mappings

  endpoint:
    enable:
      cache: true

server:
  servlet:
    session:
      timeout: 60m